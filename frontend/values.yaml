replicaCount: 1

image:
  registry: ""
  repository: frontend
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: zot-registry-secret

serviceAccount:
  name: frontend-sa

service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  requests:
    memory: "32Mi"
    cpu: "50m"
  limits:
    memory: "64Mi"
    cpu: "100m"

probes:
  liveness:
    path: /
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# HPA выключен намеренно — ограниченные ресурсы кластера (см. helm/README.md).
# Включён только у kitchen-service, где нагрузка неравномерная (пики заказов).
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  className: nginx
  host: "frontend.internal"
  path: /
  pathType: Prefix
  annotations: {}

# Секретов не требует — frontend отдаёт статику, Vault не подключаем.
vault:
  enabled: false

# Публичная переменная — адрес api-gateway ВНУТРИ того же namespace.
configMap:
  API_GATEWAY_URL: "http://api-gateway:8089"