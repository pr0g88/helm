# Helmfile для окружения staging (namespace pizzashop-staging).
# Пути к чартам — относительные (./<service>): helmfile запускается из папки helm/.
# registry, tag образа и migration.downEnabled подставляются пайплайном (cicd/.gitlab-ci.yml).
environments:
  staging:
    values:
      - image:
          tag: ""
          registry: ""
      - migration:
          downEnabled: "false"
---
releases:
  - name: kitchen-service
    namespace: pizzashop-staging
    chart: ./kitchen-service
    values:
      - ./kitchen-service/values-staging.yaml
      - image:
          tag: {{ .Environment.Values.image.tag | quote }}
          registry: {{ .Environment.Values.image.registry | quote }}
      - migrations:
          image:
            tag: {{ .Environment.Values.image.tag | quote }}
            registry: {{ .Environment.Values.image.registry | quote }}

  - name: catalog-service
    namespace: pizzashop-staging
    chart: ./catalog-service
    values:
      - ./catalog-service/values-staging.yaml
      - image:
          tag: {{ .Environment.Values.image.tag | quote }}
          registry: {{ .Environment.Values.image.registry | quote }}
      - migrations:
          image:
            tag: {{ .Environment.Values.image.tag | quote }}
            registry: {{ .Environment.Values.image.registry | quote }}

  - name: inventory-service
    namespace: pizzashop-staging
    chart: ./inventory-service
