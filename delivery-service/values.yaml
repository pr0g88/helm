replicaCount: 1

image:
  registry: ""
  repository: delivery-service
  tag: ""  # ← Пустой для переопределения через helmfile
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: zot-registry-secret

serviceAccount:
  name: delivery-service-sa

service:
  type: ClusterIP
  port: 8087
  targetPort: 8087

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

probes:
  liveness:
    path: /health
    port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /ready
    port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# HPA выключен намеренно — ограниченные ресурсы кластера (см. helm/README.md).
# Включён только у kitchen-service, где нагрузка неравномерная (пики заказов).
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Vault Agent Injector положит секреты в файлы /vault/secrets/<name> пода
# (см. common-library/templates/_deployment.tpl). Каждый элемент secrets —
# отдельный файл с перечисленными keys.
vault:
  enabled: true
  role: "pizzashop-dev"
  secretPath: "kv/pizzashop/dev/delivery"
  secrets:
    - name: db
      keys:
        - DATABASE_URL
        - JWT_SECRET
        - SYSTEM_TOKEN
    - name: rabbitmq
      keys:
        - RABBITMQ_USER
        - RABBITMQ_PASS

# Блок миграций (по умолчанию отключён, включается через values-{env}.yaml)
migrations:
  enabled: true
  type: "up"
  image:
    registry: ""
    repository: delivery-service-migrations
    tag: ""
    pullPolicy: IfNotPresent
  backoffLimit: 5
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  vault:
    enabled: true
    role: "pizzashop-dev"
    secretPath: "kv/pizzashop/dev/migrations"
  serviceAccount:
    name: "delivery-service-sa"
  databaseName: ""
  dbHost: ""
  dbPort: ""

configMap:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8087"
  ORDER_SERVICE_URL: "http://order-service:8083"
  DB_HOST: "localhost"
  DB_PORT: "5432"