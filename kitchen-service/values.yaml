replicaCount: 1

image:
  registry: ""
  repository: kitchen-service
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: zot-registry-secret

serviceAccount:
  name: kitchen-service-sa

service:
  type: ClusterIP
  port: 8086
  targetPort: 8086

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

probes:
  liveness:
    path: /health
    port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# У kitchen-service HPA включён (в отличие от остальных сервисов) —
# именно здесь нагрузка скачет сильнее всего (пики заказов на кухне).
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Vault Agent Injector положит секреты в файлы /vault/secrets/<name> пода
# (см. common-library/templates/_deployment.tpl). Каждый элемент secrets —
# отдельный файл с перечисленными keys.
vault:
  enabled: true
  role: "pizzashop-dev"
  secretPath: "kv/pizzashop/dev/kitchen"
  secrets:
    - name: db
      keys:
        - DB_USER
        - DB_PASSWORD
    - name: jwt
      keys:
        - JWT_SECRET
    - name: system
      keys:
        - SYSTEM_TOKEN
    - name: rabbitmq
      keys:
        - RABBITMQ_USER
        - RABBITMQ_PASS

# Миграции - роль берется из vault.role основного чарта
migrations:
  enabled: true
  type: "up"
  image:
    registry: ""
    repository: kitchen-service-migrations
    tag: ""
    pullPolicy: IfNotPresent
  backoffLimit: 5
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  vault:
    enabled: true
    role: "pizzashop-dev"
    secretPath: "kv/pizzashop/dev/migrations"
  serviceAccount:
    name: "kitchen-service-sa"
  databaseName: "kitchen_db"
  dbHost: "postgres"
  dbPort: "5432"

configMap:
  SERVER_PORT: "8086"
  LOG_LEVEL: "info"
  DB_SSLMODE: "disable"

  INVENTORY_SERVICE_URL: "http://localhost:8085"
  ORDER_SERVICE_URL: "http://localhost:8083"
  RABBITMQ_HOST: "localhost"
  RABBITMQ_PORT: "5672"