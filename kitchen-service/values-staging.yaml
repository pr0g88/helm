image:
  tag: ""

serviceAccount:
  name: kitchen-service-sa

vault:
  role: "pizzashop-staging"
  secretPath: "kv/pizzashop/staging/kitchen"

  # Миграции
migrations:
  enabled: true
  type: "up"
  image:
    tag: ""
  vault:
    role: "pizzashop-staging"
    secretPath: "kv/pizzashop/staging/migrations"  # Добавлен префикс kv/
  databaseName: "kitchen_db"
  dbHost: "nginx-egress.egress-gateway.svc.cluster.local"
  dbPort: "9001"

configMap:
  LOG_LEVEL: "debug"
  DB_HOST: "nginx-egress.egress-gateway.svc.cluster.local"
  DB_PORT: "9001"
  DB_NAME: "kitchen_staging_db"
  INVENTORY_SERVICE_URL: "http://inventory-service:8085"
  ORDER_SERVICE_URL: "http://order-service:8083"
  RABBITMQ_HOST: "rabbitmq.pizzashop-staging.svc.cluster.local"
  RABBITMQ_PORT: "5672"