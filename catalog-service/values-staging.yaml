image:
  tag: ""

serviceAccount:
  name: catalog-service-sa

vault:
  role: "pizzashop-staging"
  secretPath: "kv/pizzashop/staging/catalog"

# Миграции для staging
migrations:
  enabled: true
  type: "up"
  image:
    tag: ""
  vault:
    role: "pizzashop-staging"
    secretPath: "kv/pizzashop/staging/migrations"
  databaseName: "catalog_staging_db"
  dbHost: "nginx-egress.egress-gateway.svc.cluster.local"
  dbPort: "9001"

configMap:
  LOG_LEVEL: "info"
  DB_HOST: "nginx-egress.egress-gateway.svc.cluster.local"
  DB_PORT: "9001"
  DB_NAME: "catalog_staging_db"
  INVENTORY_SERVICE_URL: "http://inventory-service:8085"
  ORDER_SERVICE_URL: "http://order-service:8083"