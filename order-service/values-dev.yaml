image:
  tag: ""

serviceAccount:
  name: order-service-sa

vault:
  role: "pizzashop-dev"
  secretPath: "kv/pizzashop/dev/order"

# Миграции для dev
migrations:
  enabled: true
  type: "up"
  image:
    tag: ""
  vault:
    role: "pizzashop-dev"
    secretPath: "kv/pizzashop/dev/migrations"
  databaseName: "order_db"
  dbHost: "nginx-egress.egress-gateway.svc.cluster.local"
  dbPort: "9001"

configMap:
  LOG_LEVEL_APP: "DEBUG"
  DB_HOST: "nginx-egress.egress-gateway.svc.cluster.local"
  DB_PORT: "9001"
  DB_NAME: "order_db"
  RABBITMQ_HOST: "rabbitmq.pizzashop-dev.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  PAYMENT_SERVICE_URL: "http://payment-service:8084"
  CATALOG_SERVICE_URL: "http://catalog-service:8082"