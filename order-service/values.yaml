replicaCount: 1

image:
  registry: ""
  repository: order-service
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: zot-registry-secret

serviceAccount:
  name: order-service-sa

service:
  type: ClusterIP
  port: 8083
  targetPort: 8083

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "500m"

probes:
  liveness:
    path: /actuator/health
    port: http
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    path: /actuator/health
    port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# HPA выключен намеренно — ограниченные ресурсы кластера (см. helm/README.md).
# Включён только у kitchen-service, где нагрузка неравномерная (пики заказов).
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Vault Agent Injector положит секреты в файлы /vault/secrets/<name> пода
# (см. common-library/templates/_deployment.tpl). Каждый элемент secrets —
# отдельный файл с перечисленными keys.
vault:
  enabled: true
  role: "pizzashop-dev"
  secretPath: "kv/pizzashop/dev/order"
  secrets:
    - name: db
      keys:
        - DB_URL
        - DB_USERNAME
        - DB_PASSWORD
    - name: rabbitmq
      keys:
        - RABBITMQ_USERNAME
        - RABBITMQ_PASSWORD
    - name: jwt
      keys:
        - JWT_SECRET

# Миграции
migrations:
  enabled: true
  type: "up"
  image:
    registry: ""
    repository: order-service-migrations
    tag: ""
    pullPolicy: IfNotPresent
  backoffLimit: 5
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  vault:
    enabled: true
    role: "pizzashop-dev"
    secretPath: "kv/pizzashop/dev/migrations"
  serviceAccount:
    name: "order-service-sa"
  databaseName: ""
  dbHost: ""
  dbPort: ""

configMap:
  SERVER_PORT: "8083"
  SPRING_APPLICATION_NAME: "order-service"
  DB_MAX_POOL_SIZE: "10"
  DB_MIN_IDLE: "5"
  DB_MAX_LIFETIME: "300000"
  DB_IDLE_TIMEOUT: "300000"
  DB_CONNECTION_TIMEOUT: "30000"
  DB_VALIDATION_TIMEOUT: "5000"
  DB_LEAK_DETECTION: "60000"
  DB_SSLMODE: "disable"
  RABBITMQ_VHOST: "/"
  JPA_DDL_AUTO: "update"
  JPA_SHOW_SQL: "false"
  LOG_LEVEL_APP: "DEBUG"
  LOG_LEVEL_SPRING_WEB: "INFO"
  LOG_LEVEL_FEIGN: "DEBUG"
  LOG_LEVEL_ROOT: "INFO"